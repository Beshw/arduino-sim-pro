# Installs the Windows installer on a real Windows runner, runs the packaged
# app's headless acceptance suite (--self-test) and uploads the JSON reports.
name: Windows self-test
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose installer should be tested (e.g. v1.2.0)'
        required: true
  release:
    types: [published]
jobs:
  selftest:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Download installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.event.release.tag_name }}" }
          gh release download $tag --repo "${{ github.repository }}" --pattern '*.exe' --output setup.exe
          (Get-FileHash setup.exe -Algorithm SHA256).Hash
      - name: Silent install (per-user)
        shell: pwsh
        run: |
          Start-Process -FilePath .\setup.exe -ArgumentList '/S' -Wait
          $exe = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Arduino Simulator Pro.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Installed executable not found' }
          "APP_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run packaged acceptance suite
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\asp-reports"
          $p = Start-Process -FilePath $env:APP_EXE -ArgumentList '--self-test', $out -Wait -PassThru
          Get-Content "$out\summary.json"
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-selftest-reports
          path: ${{ runner.temp }}/asp-reports
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: GUI end-to-end test on real Windows (Playwright + installed app)
        shell: pwsh
        run: |
          npm install --no-save --ignore-scripts playwright@1.63.0
          $out = "$env:RUNNER_TEMP\asp-e2e"
          node tests/e2e/ui.e2e.mjs $out "$env:APP_EXE"
          if ($LASTEXITCODE -ne 0) { throw "GUI e2e failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-gui-e2e
          path: ${{ runner.temp }}/asp-e2e
      - name: Uninstall
        if: always()
        shell: pwsh
        run: |
          $u = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Uninstall Arduino Simulator Pro.exe' | Select-Object -First 1
          if ($u) { Start-Process -FilePath $u.FullName -ArgumentList '/S' -Wait }
